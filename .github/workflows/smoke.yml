name: CPU smoke
on:
  pull_request:
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: pytest -q -m smoke
